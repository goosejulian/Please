<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stick Road</title>
  <style>
    :root {
      color-scheme: only light;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 12px;
      left: 12px;
      background: #fff;
      border: 2px solid #000;
      color: #000;
      padding: 8px 10px;
      font-size: 14px;
      line-height: 1.3;
      max-width: 420px;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="black and white stick figure road game"></canvas>
  <div class="hud">
    <strong>How to play:</strong> no controls needed — it plays itself.<br />
    Optional: press <strong>Space</strong> to pause/resume.
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const state = {
      x: 80,
      y: 0,
      walkSpeed: 120,
      legPhase: 0,
      paused: false,
      pauseTimer: 0,
      speakCooldown: rand(2.5, 5),
      currentEvent: "damn you smell!",
      currentEventDuration: 2,
      dashes: [],
      manualPause: false,
    };

    const EVENTS = [
      { text: "damn you smell!", duration: [1.4, 2.2], vomit: false },
      { text: "Noah smells", duration: [1.4, 2.2], vomit: false },
      { text: "Nate Smells", duration: [1.4, 2.2], vomit: false },
      { text: "Liam REALLY smells", duration: [4, 4], vomit: true },
      { text: "Julian smells great", duration: [1.4, 2.2], vomit: false },
    ];

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function resize() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      state.y = window.innerHeight * 0.68;
      resetRoad();
    }

    function resetRoad() {
      state.dashes = [];
      const roadTop = window.innerHeight * 0.72;
      for (let x = -60; x < window.innerWidth + 60; x += 80) {
        state.dashes.push({ x, y: roadTop + 40 });
      }
    }

    function update(dt) {
      if (state.manualPause) {
        return;
      }

      if (state.paused) {
        state.pauseTimer -= dt;
        if (state.pauseTimer <= 0) {
          state.paused = false;
          state.speakCooldown = rand(3, 6);
        }
      } else {
        state.legPhase += dt * 9;
        state.speakCooldown -= dt;

        if (state.speakCooldown <= 0) {
          const event = EVENTS[Math.floor(Math.random() * EVENTS.length)];
          state.paused = true;
          state.currentEvent = event.text;
          state.currentEventDuration = rand(event.duration[0], event.duration[1]);
          state.pauseTimer = state.currentEventDuration;
        }
      }

      const shift = state.walkSpeed * dt * (state.paused ? 0 : 1);
      for (const dash of state.dashes) {
        dash.x -= shift;
        if (dash.x < -60) {
          dash.x += window.innerWidth + 120;
        }
      }
    }

    function drawRoad() {
      const h = window.innerHeight;
      const w = window.innerWidth;
      const roadTop = h * 0.72;

      ctx.fillStyle = "#000";
      ctx.fillRect(0, roadTop, w, h - roadTop);

      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 6;
      for (const dash of state.dashes) {
        ctx.beginPath();
        ctx.moveTo(dash.x, roadTop + 40);
        ctx.lineTo(dash.x + 40, roadTop + 40);
        ctx.stroke();
      }
    }

    function drawStickFigure() {
      const x = state.x;
      const y = state.y;
      const isVomitEvent = state.paused && state.currentEvent === "Liam REALLY smells";
      const stride = isVomitEvent ? 0 : Math.sin(state.legPhase) * 11;
      const armSwing = isVomitEvent ? 0 : Math.sin(state.legPhase + Math.PI) * 9;

      ctx.strokeStyle = "#000";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";

      if (isVomitEvent) {
        ctx.beginPath();
        ctx.arc(x - 12, y - 40, 14, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x - 2, y - 32);
        ctx.lineTo(x + 20, y - 12);
        ctx.lineTo(x + 30, y + 4);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + 10, y - 20);
        ctx.lineTo(x - 8, y - 10);
        ctx.moveTo(x + 14, y - 16);
        ctx.lineTo(x + 34, y - 6);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + 30, y + 4);
        ctx.lineTo(x + 18, y + 24);
        ctx.moveTo(x + 30, y + 4);
        ctx.lineTo(x + 44, y + 24);
        ctx.stroke();

        drawVomit(x + 2, y - 35);
      } else {
        ctx.beginPath();
        ctx.arc(x, y - 58, 14, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y - 44);
        ctx.lineTo(x, y - 8);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y - 32);
        ctx.lineTo(x - 16 + armSwing, y - 16);
        ctx.moveTo(x, y - 32);
        ctx.lineTo(x + 16 - armSwing, y - 16);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y - 8);
        ctx.lineTo(x - 17 + stride, y + 24);
        ctx.moveTo(x, y - 8);
        ctx.lineTo(x + 17 - stride, y + 24);
        ctx.stroke();
      }
    }

    function drawVomit(fromX, fromY) {
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.quadraticCurveTo(fromX + 24, fromY + 16, fromX + 36, fromY + 44);
      ctx.stroke();

      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(fromX + 40, fromY + 48, 14, 7, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSpeechBubble() {
      if (!state.paused) return;

      const bubbleX = state.x + 30;
      const bubbleY = state.y - 118;
      const text = state.currentEvent;

      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 3;

      const bubbleWidth = Math.max(220, text.length * 12 + 24);
      roundRect(bubbleX, bubbleY, bubbleWidth, 52, 10);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(state.x + 20, state.y - 70);
      ctx.lineTo(state.x + 28, state.y - 62);
      ctx.lineTo(state.x + 34, state.y - 78);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#000";
      ctx.font = "24px 'Courier New', monospace";
      ctx.fillText(text, bubbleX + 12, bubbleY + 34);
    }

    function roundRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function draw() {
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      drawRoad();
      drawStickFigure();
      drawSpeechBubble();
    }

    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        state.manualPause = !state.manualPause;
      }
    });

    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
